name: App testing

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Unit tests, lint and APK build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: bash ./gradlew testDebugUnitTest lint assembleDebug assembleRelease --stacktrace
      - name: Upload verification reports (no randomly signed APK)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
  ui:
    name: Custom feature UI regression (Android 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on disposable emulator, never a user's phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash ./gradlew installDebug installDebugAndroidTest --stacktrace
            adb shell appwidget grantbind --package fr.neamar.kiss.sequence.debug --user 0
            bash ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=fr.neamar.kiss.androidTest.WidgetGridTest,fr.neamar.kiss.androidTest.WidgetSwipeTest,fr.neamar.kiss.androidTest.RealWidgetTest,fr.neamar.kiss.androidTest.SequentialInputTest,fr.neamar.kiss.androidTest.WidgetScrollTest --stacktrace
      - name: Upload UI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
