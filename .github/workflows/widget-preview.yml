name: Build KISS Widget Preview APK

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/widget-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-widget-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out integrated widget branch
        uses: actions/checkout@v4
        with:
          ref: feat/widget-grid-swipe-integration
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build integrated debug APK
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload integrated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KISS-widget-grid-swipe-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run unit tests and lint
        run: bash ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace
